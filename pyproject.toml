[project]
name = "wsp-lab"
version = "0.1.0"
description = "Weight-Space Programming lab: predict LLM performance change from weight change (SSM/JEPA predictor over edit trajectories)"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.15",
  "cloudpickle>=3",
  "transformers>=5.22",
  "accelerate",
  "safetensors",
  "datasets",
  "peft",
  "huggingface_hub[cli]",
  "einops",
  "optuna",
  "numpy",
  "scipy",
  "scikit-learn",
  "lightgbm",
  "pandas",
  "matplotlib>=3.8",
  "pillow>=10",
  "pyarrow",
  "tqdm",
  "pyyaml",
  "httpx",
  "jsonschema",
  "typer",
  "rich",
  "lm-eval>=0.4.13",
  "heretic-llm==2.0.0",
  "flash-linear-attention",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff", "mypy", "ipykernel", "jupyter"]
ssm = ["mamba-ssm>=2.3", "causal-conv1d"]
serve = ["vllm"]
[tool.pytest.ini_options]
addopts = "-m 'not gpu and not slow and not net'"
testpaths = ["tests"]
timeout = 600
markers = ["gpu: needs CUDA", "slow: long-running", "net: needs network/HF"]
[tool.ruff]
line-length = 100
extend-exclude = ["data", ".worktrees", ".venv", "paper/template"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
