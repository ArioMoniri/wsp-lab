# P4b / H6 zoo for LFM3-1.7B. Same families, counts and sampling ranges as configs/zoo_qwen3.5-0.8b.yaml
# (heretic_ara per D6: n=12, trials=10, production threshold trials>=10). Only depth-dependent values
# are rescaled to this model's 24 layers: random_dir.layers = round(0.8B layers * 24/24); abliteration
# direction_index max = 24-1, max_weight_position max = 24, min_weight_distance max = 24//2.
# Tensor selection: `tensors:` entries are writer components (attn_out, mlp_out), the legacy 0.8B names
# (self_attn.o_proj, mlp.down_proj: role aliases) or regexes over the in-layer module path; the
# `architecture:` block names the writers/post-norms of this model (see docs/ARCHITECTURES.md).
# trust_remote_code: LFM3 ships custom modelling code (pinned snapshot, allow-listed in wsp.zoo.arch).
# fold_post_norm: LFM3 has a sandwich norm, so abliteration folds the post-norm gain into the direction.
base_model: LiquidAI/LFM3-1.7B
base_revision: main
dtype: bfloat16
out_dir: data/zoo/lfm3-1.7b
seed: 0
trust_remote_code: true
architecture:
  family: lfm3
  hidden_size: 2048
  num_layers: 24
  writers:
    attn_out:
    - self_attn\.o_proj
    - conv\.out_proj
    mlp_out:
    - feed_forward\.w2
  post_norms:
    attn_out: post_operator_norm
    mlp_out: post_ffn_norm
  norm_gain: weight
families:
  random_dir:
    n: 150
    layers:
    - 8
    - 12
    - 15
    - 17
    - 19
    - 21
    tensors:
    - mlp.down_proj
    - self_attn.o_proj
    weight:
      min: 0.25
      max: 1.0
    n_directions:
      choices:
      - 1
      - 2
      - 4
  abliteration:
    n: 200
    direction_index:
      min: -1
      max: 23
    max_weight:
      min: 0.3
      max: 1.3
    max_weight_position:
      min: 0
      max: 24
    min_weight:
      min: 0.0
      max: 0.6
    min_weight_distance:
      min: 1
      max: 12
    components:
    - attn
    - mlp
    - both
    fold_post_norm: true
  heretic_ara:
    kl_divergence_target: 0.5
    n: 12
    preserve_good_behavior_weight:
      choices:
      - 0.5
      - 1
      - 2
      - 4
    trials: 10
  lora_sft:
    n: 120
    datasets:
    - gsm8k_train
    - alpaca_cleaned_5k
    rank:
      choices:
      - 4
      - 8
      - 16
      - 32
    lr:
      log_min: 2.0e-05
      log_max: 0.0005
    steps:
      choices:
      - 50
      - 150
      - 400
      - 800
  task_vector:
    n: 80
    scale:
      min: -0.5
      max: 1.5
  chain:
    n: 150
    length:
      min: 2
      max: 8
eval:
  config: configs/eval_cheap.yaml
eligibility:
  min_params:
    heretic_ara:
      trials: 10
    lora_sft:
      steps: 50
