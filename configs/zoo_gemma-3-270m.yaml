# P4b / H6 zoo for Gemma-3-270M-it. Same families, counts and sampling ranges as configs/zoo_qwen3.5-0.8b.yaml
# (heretic_ara per D6: n=12, trials=10, production threshold trials>=10). Only depth-dependent values
# are rescaled to this model's 18 layers: random_dir.layers = round(0.8B layers * 18/24); abliteration
# direction_index max = 18-1, max_weight_position max = 18, min_weight_distance max = 18//2.
# Tensor selection: `tensors:` entries are writer components (attn_out, mlp_out), the legacy 0.8B names
# (self_attn.o_proj, mlp.down_proj: role aliases) or regexes over the in-layer module path; the
# `architecture:` block names the writers/post-norms of this model (see docs/ARCHITECTURES.md).
# Gated repo: licence accepted for the account in HF_TOKEN (4 Nov 2026). hidden_size / num_layers are declared so
# --dry-run works without file access (checked against the model config whenever it is readable).
# Gemma-3 has a sandwich norm (gain 1 + weight): abliteration folds it (fold_post_norm).
# refusal_response_prefix: the Gemma template has no CoT block, so Heretic's prefix detection would
# refuse; empty prefix = read residuals at the end of the generation prompt.
base_model: google/gemma-3-270m-it
base_revision: main
dtype: bfloat16
out_dir: data/zoo/gemma-3-270m
seed: 0
refusal_response_prefix: ''
architecture:
  family: gemma3
  hidden_size: 640
  num_layers: 18
  writers:
    attn_out:
    - self_attn\.o_proj
    mlp_out:
    - mlp\.down_proj
  post_norms:
    attn_out: post_attention_layernorm
    mlp_out: post_feedforward_layernorm
  norm_gain: one_plus_weight
families:
  random_dir:
    n: 150
    layers:
    - 6
    - 9
    - 11
    - 13
    - 14
    - 16
    tensors:
    - mlp.down_proj
    - self_attn.o_proj
    weight:
      min: 0.25
      max: 1.0
    n_directions:
      choices:
      - 1
      - 2
      - 4
  abliteration:
    n: 200
    direction_index:
      min: -1
      max: 17
    max_weight:
      min: 0.3
      max: 1.3
    max_weight_position:
      min: 0
      max: 18
    min_weight:
      min: 0.0
      max: 0.6
    min_weight_distance:
      min: 1
      max: 9
    components:
    - attn
    - mlp
    - both
    fold_post_norm: true
  heretic_ara:
    n: 12
    preserve_good_behavior_weight:
      choices:
      - 0.5
      - 1
      - 2
      - 4
    trials: 10
  lora_sft:
    n: 120
    datasets:
    - gsm8k_train
    - alpaca_cleaned_5k
    rank:
      choices:
      - 4
      - 8
      - 16
      - 32
    lr:
      log_min: 2.0e-05
      log_max: 0.0005
    steps:
      choices:
      - 50
      - 150
      - 400
      - 800
  task_vector:
    n: 80
    scale:
      min: -0.5
      max: 1.5
  chain:
    n: 150
    length:
      min: 2
      max: 8
eval:
  config: configs/eval_cheap.yaml
eligibility:
  min_params:
    heretic_ara:
      trials: 10
    lora_sft:
      steps: 50
