<title id="title">From weight edits to benchmark forecasts</title>
<desc id="desc">Qwen3.5-0.8B fans into abliterate, LoRA and merge edits. Canonical SVD delta tokens feed a state-space predictor and a schematic forecast with an illustrative confidence band for MATH, GSM8K, IFEval and refusal.</desc>
