# P1 r3 GPU smoke: production config minus heretic_ara (40 trials ~ hours on the shared GPU); use with --override lora_sft.steps=5 seed 5 gives a chain with two lora_vs_base steps.
base_model: Qwen/Qwen3.5-0.8B
base_revision: main
dtype: bfloat16
out_dir: data/zoo/p1-zoo-r3-smoke
seed: 5
families:
  random_dir:
    n: 150
    layers:
    - 8
    - 12
    - 15
    - 17
    - 19
    - 21
    tensors:
    - mlp.down_proj
    - self_attn.o_proj
    weight:
      min: 0.25
      max: 1.0
    n_directions:
      choices:
      - 1
      - 2
      - 4
  abliteration:
    n: 200
    direction_index:
      min: -1
      max: 23
    max_weight:
      min: 0.3
      max: 1.3
    max_weight_position:
      min: 0
      max: 24
    min_weight:
      min: 0.0
      max: 0.6
    min_weight_distance:
      min: 1
      max: 12
    components:
    - attn
    - mlp
    - both
  lora_sft:
    n: 120
    datasets:
    - gsm8k_train
    - alpaca_cleaned_5k
    rank:
      choices:
      - 4
      - 8
      - 16
      - 32
    lr:
      log_min: 2.0e-05
      log_max: 0.0005
    steps:
      choices:
      - 50
      - 150
      - 400
      - 800
  chain:
    n: 150
    length:
      min: 3
      max: 4
eval:
  config: configs/eval_cheap.yaml
eligibility:
  min_params:
    heretic_ara:
      trials: 20
    lora_sft:
      steps: 50
